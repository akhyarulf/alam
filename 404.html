<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak ditemukan — Alam Viewer</title>
<meta name="description" content="Halaman yang kamu cari tidak ada di Alam Viewer.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#2f4638">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="apple-touch-icon" href="/assets/img/icon-180.png">
<link rel="manifest" href="/site.webmanifest">

<!-- Untuk halaman 404 tidak perlu canonical: URL ini tidak pernah jadi
     halaman yang diindeks, dan canonical-nya akan menyesatkan. -->

<style>
  :root {
    --bg: #202c24;
    --card: #26332a;
    --border: #35463a;
    --text: #eef4ef;
    --text-light: #a9bcae;
    --primary: #6f9b78;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.55;
    text-align: center;
  }

  .box {
    max-width: 460px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 24px;
  }

  .code {
    font-size: 52px;
    font-weight: 700;
    line-height: 1;
    margin: 0 0 10px;
    color: var(--primary);
    letter-spacing: 2px;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }

  p {
    margin: 0 0 22px;
    color: var(--text-light);
    font-size: 14px;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  a.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 11px 18px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--border);
    color: var(--text);
  }

  a.btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #10231a;
  }

  a.btn:hover { filter: brightness(1.08); }
</style>
</head>

<body>
  <main class="box">
    <p class="code">404</p>
    <h1>Jalur ini tidak ketemu</h1>
    <p>
      Halaman yang kamu cari sudah berubah alamat atau tidak pernah ada.
      Coba kembali ke daftar jalur untuk memilih rute pendakian lainnya.
    </p>
    <div class="actions">
      <a class="btn primary" href="/">Lihat daftar jalur</a>
      <a class="btn" href="/upload.html">Upload GPX baru</a>
    </div>
  </main>
</body>

</html>
