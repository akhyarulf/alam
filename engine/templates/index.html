<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Alam Engine - Editor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="/static/editor.css"/>
</head>
<body>

<div id="app">

  <aside id="panel">

    <h1>🏔️ Alam Engine</h1>
    <p class="sub">Editor lokal - trim, waypoint, export, upload</p>

    <section>
      <h2>1. File</h2>
      <input type="file" id="fileInput" accept=".gpx,.geojson,.json,.kml,.kmz,.csv,.tcx">
      <div id="fileList"></div>
    </section>

    <section>
      <h2>2. Trim</h2>
      <label>Potong dari awal: <span id="trimStartVal">0</span> titik</label>
      <input type="range" id="trimStart" min="0" max="0" value="0">
      <label>Potong dari akhir: <span id="trimEndVal">0</span> titik</label>
      <input type="range" id="trimEnd" min="0" max="0" value="0">
    </section>

    <section>
      <h2>3. Info Jalur</h2>
      <label>Nama</label>
      <input type="text" id="fieldName">
      <label>Gunung</label>
      <input type="text" id="fieldMountain">
      <label>Jalur</label>
      <input type="text" id="fieldRoute">
      <label>Route ID (otomatis)</label>
      <input type="text" id="fieldRouteId" disabled>
    </section>

    <section>
      <h2>4. Waypoint</h2>
      <p class="hint">Klik titik di peta buat nambah waypoint.</p>
      <div id="waypointList"></div>
    </section>

    <section>
      <h2>5. Output</h2>
      <div id="formatList"></div>
      <label class="checkbox">
        <input type="checkbox" id="uploadToggle" checked>
        Upload ke GitHub &amp; Google Drive
      </label>
    </section>

    <button id="processBtn" disabled>🚀 Proses &amp; Simpan</button>

    <div id="result"></div>

  </aside>

  <main id="mapWrap">
    <div id="map"></div>
    <div id="stats" class="info"></div>
  </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.OUTPUT_FORMATS = {{ formats | tojson }};</script>
<script src="/static/editor.js"></script>
</body>
</html>
